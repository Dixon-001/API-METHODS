<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/output.css">
</head>
<body class="p-10 ">
    <div class="">
        <h1 class="flex justify-center text-2xl font-bold p-2">All Posts</h1>
        <div id="posts" class="grid grid-cols-1 md:grid-cols-5 gap-4 bg-blue-50 border border-blue-500 rounded-md p-4">
            <!-- posts contents  -->
        </div>
    </div>
    <!-- post 5 -->
    <div>
          <h1 class="flex justify-center text-2xl font-bold p-2">Post 5</h1>
         <div id="single" class="bg-blue-200">
            <!-- single post here  -->
        </div>
        <!-- created post  -->
        <h1 class="flex justify-center text-2xl font-bold p-2">Created post</h1>
        <div id="create" class="bg-blue-300 ">
            <!-- post is created here  -->
        </div>
        <div>
             <h1 class="flex justify-center text-2xl font-bold p-2">put post</h1>
            <div id="put" class="bg-green-300 ">
                <!-- post is put here  -->
            </div>
        </div>
            <!-- patch post  -->
        <div>
              <h1 class="flex justify-center text-2xl font-bold p-2">patched post</h1>
            <div id="patch" class="bg-green-200 ">
                <!-- post is patched here  -->
            </div>
                    <!-- delete post  -->
              <h1 class="flex justify-center text-2xl font-bold p-2">deleted post 7</h1>
            <div id="delete" class="bg-red-300 ">
                <!-- post is created here  -->
            </div  
        </div>
    </div>
    
     <script>
        // getting all 100posts 

        const post = document.getElementById('posts')
        async function getAllPosts() {
            try {  await fetch ('https://jsonplaceholder.typicode.com/posts')
                .then ((response) => response.json())
                .then(result=> {
                    console.log(result)
                    result.forEach((posts) => {
                    const div = document.createElement('div')
                    div.style.border = '1px solid black'
                    div.style.padding = '10px'
                    div.style.borderRadius = '16px'
                    div.style.fontFamily = 'sans-serif'
                    div.innerHTML =`
                        <h3> <strong>User ID: </strong> ${posts.userId}</h3>
                        <h3><strong>post ID: </strong> ${posts.id}</h3>
                        <p><strong> post title: </strong>${posts.title}</p>
                         <p> <strong>post body: </strong>${posts.body}</p>
                    `
                    post.appendChild(div)
    
                    


                
                })
           })
           } catch (error) {
            console.error(error.message)
            
           }
            
        }
        getAllPosts()

        // getting post number 5
         const single = document.getElementById('single')
        async function getSinglePost() {
            try {  await fetch ('https://jsonplaceholder.typicode.com/posts/5')
                .then ((response) => response.json())
                .then(result=> {
                console.log(result)
                console.log(Object.keys(result))
                const div = document.createElement('div')
                div.style.border = '1px solid black'
                div.style.padding = '10px'
                div.style.borderRadius = '16px'
                div.style.fontFamily = 'sans-serif'
                div.innerHTML =`
                    <h3> <strong>User ID: </strong> ${result.userId}</h3>
                    <h3><strong>post ID: </strong> ${result.id}</h3>
                    <p><strong> post title: </strong>${result.title}</p>
                    <p> <strong>post body: </strong>${result.body}</p>
                `
                single.appendChild(div)     
           })
           } catch (error) {
            console.error(error.message)
            
           }
            
        }
        getSinglePost()

        // creating a new post 
            const container = document.getElementById('create')
    async function createPost() {
        try {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: 1,
                    title: 'Down',
                    body: 'Down by the riverside he laid, a mastery of craft and architecture,an embodiment of ..',
                   
                })
            });
            console.log(response)

            const result = await response.json();

            const div = document.createElement('div');
            div.style.border = '1px solid black';
            div.style.padding = '10px';
            div.style.borderRadius = '16px';
            div.innerHTML = ` 
                 <p><strong>User ID: </strong> ${result.userId}</p>
                <p><strong>Post ID: </strong>${result.id}</p>
                <h3><strong>Post title: </strong>${result.title}</h3>
                <p <strong>Body:</strong>${result.body}</p>
               
            `
            container.appendChild(div)
        } catch (error) {
            console.error(error.message)
        }
    } createPost();  

     // putting in post 3 
            const put = document.getElementById('put')
    async function putPost() {
        try {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts/3', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                     userId: 1,
                    title: 'old Rogers',
                    body: 'old rogers is gone and gone to his grave,they planted an orange tree over his head..',
                   
                })
            });
            console.log(response)

            const result = await response.json();

            const div = document.createElement('div');
            div.style.border = '1px solid black';
            div.style.padding = '10px';
            div.style.borderRadius = '16px';
            div.innerHTML = ` 
                 <p><strong>User ID: </strong> ${result.userId}</p>
                <p><strong>Post ID: </strong>${result.id}</p>
                <h3><strong>Post title: </strong>${result.title}</h3>
                <p <strong>Body:</strong>${result.body}</p>
               
            `
            put.appendChild(div)
        } catch (error) {
            console.error(error.message)
        }
    } putPost();

     // patching post 5 
            const patch = document.getElementById('patch')
      async function patchPost() {
        try {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts/5', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title: 'Mr.McAnthony',
                   
                })
            });
            console.log(response)

            const result = await response.json();

            const div = document.createElement('div');
            div.style.border = '1px solid black';
            div.style.padding = '10px';
            div.style.borderRadius = '16px';
            div.innerHTML = ` 
                 <p><strong>User ID: </strong> ${result.userId}</p>
                <p><strong>Post ID: </strong>${result.id}</p>
                <h3><strong>Post title: </strong>${result.title}</h3>
                <p <strong>Body:</strong>${result.body}</p>
               
            `
            patch.appendChild(div)
        } catch (error) {
            console.error(error.message)
        }
    }

            patchPost();
        
     // patching post 5 
            const deleted = document.getElementById('delete')
      async function deletePost() {
        try {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts/7', {
                method: 'DELETE',
               
            });
            console.log(response.status)

            const result = await response.json();

            const div = document.createElement('div');
            div.style.border = '1px solid black';
            div.style.padding = '10px';
            div.style.borderRadius = '16px';
            div.innerHTML = ` 
                 <p><strong>User ID: </strong> ${result.userId}</p>
                <p><strong>Post ID: </strong>${result.id}</p>
                <h3><strong>Post title: </strong>${result.title}</h3>
                <p <strong>Body:</strong>${result.body}</p>
               
            `
            deleted.appendChild(div)
        } catch (error) {
            console.error(error.message)
        }
    }

            deletePost();
    </script>
</body>
</html>
